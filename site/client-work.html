<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slow Drag Studio | Client Work Refresh</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="The Slow Drag Studio Client Work page is being refreshed and is temporarily unavailable."
    />
    <link rel="canonical" href="https://slowdragstudio.com/" />
    <link rel="icon" type="image/png" href="/Logo%20and%20font/logo.png" />
    <style>
      @font-face {
        font-family: "OffBit Body";
        src: url("./Logo%20and%20font/OffBit-Regular.ttf") format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: "OffBit 101";
        src: url("./Logo%20and%20font/OffBit-101.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        --bg: #fff1cc;
        --text: #13110d;
        --muted: rgba(19, 17, 13, 0.68);
        --line: rgba(19, 17, 13, 0.18);
        --pink: #ff2fb3;
        --blue: #00d8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--text);
        background:
          linear-gradient(135deg, rgba(0, 216, 255, 0.18), transparent 36%),
          linear-gradient(315deg, rgba(255, 47, 179, 0.18), transparent 34%),
          var(--bg);
        font-family: "OffBit Body", "Courier New", monospace;
      }

      main {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        background: rgba(255, 248, 224, 0.78);
        padding: clamp(28px, 6vw, 56px);
      }

      img {
        width: min(220px, 70vw);
        height: auto;
        display: block;
        margin-bottom: 40px;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
      }

      h1 {
        margin: 0 0 20px;
        max-width: 12ch;
        font-family: "OffBit 101", "OffBit Body", monospace;
        font-size: clamp(3.4rem, 12vw, 8rem);
        line-height: 0.82;
        letter-spacing: 0;
      }

      a {
        color: var(--text);
        text-decoration-color: var(--blue);
        text-underline-offset: 0.22em;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./Logo%20and%20font/fulllogo.png" alt="Slow Drag Studio" />
      <h1>Work page being refreshed.</h1>
      <p>
        This Client Work page is temporarily offline while the current Slow Drag Studio material is restored.
      </p>
      <p><a href="/">Return to the homepage</a></p>
    </main>
  </body>
</html>
